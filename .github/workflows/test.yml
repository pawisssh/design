name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its run still in progress, so a superseded commit holds no runner;
# a push to main is grouped by its commit, so every commit on main keeps its run.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # npm test on the owner's Mac, a self-hosted runner registered to this repo only (label `design`), beside the echo
  # repo's runner on the same machine. GitHub-hosted runners stopped starting jobs while the account's billing failed;
  # self-hosted jobs still run. One runner takes one job at a time, so runs queue rather than share the CPU.
  test:
    runs-on: [self-hosted, macOS, ARM64, design]
    timeout-minutes: 45
    steps:
      # clean: false, then a clean that keeps only the pinned tools the sources.mjs and deps.mjs steps verify and
      # extract: any other untracked file goes, a test file from another branch or a test's output left in .scratch.
      # fetch-depth: 0 gives duplicates.mjs the pull request's base to diff against; on this runner's kept clone, a
      # later fetch only adds what is new.
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
      - run: |
          git clean -ffdx -e .scratch
          mkdir -p .scratch && find .scratch -mindepth 1 -maxdepth 1 ! -name adapter-carbon ! -name adapter-generic ! -name to-handoff -exec rm -rf {} +
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Without the pinned Carbon sources and preview packages, the adapter-carbon tests that need them skip.
      - run: node skills/adapter-carbon/scripts/sources.mjs
      # Without the pinned Tailwind, TypeScript, shadcn stylesheets and preview packages, the adapter-generic
      # tests that need them skip.
      - run: node skills/adapter-generic/scripts/sources.mjs
      # Without its packages, the to-handoff tests skip; the runtime tests, and adapter-generic's catalog
      # measurements, use the Mac's Chrome.
      - run: node skills/to-handoff/scripts/deps.mjs
      # npm test runs at its default --test-concurrency=4. TAP goes to the log, and slowest-files.mjs adds the
      # slowest files to the end of the log and to the job summary.
      - run: npm test
        env:
          NODE_OPTIONS: >-
            --test-reporter=tap --test-reporter-destination=stdout
            --test-reporter=${{ github.workspace }}/.github/slowest-files.mjs --test-reporter-destination=stdout
      # A block of 8+ lines the pull request adds under skills/ that the repo already has fails the run; it runs even
      # when a test fails, so both are reported.
      - if: github.event_name == 'pull_request' && !cancelled()
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .github/duplicates.mjs "origin/$BASE_REF"
