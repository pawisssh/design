name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its run still in progress, so a superseded commit holds no runner;
# a push to main is grouped by its commit, so every commit on main keeps its run.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # npm test split four ways by file, each shard on its own runner: one runner ran it in about 20 minutes,
  # CPU-bound. The four sum to every file npm test runs.
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Without the pinned Carbon sources and preview packages, the adapter-carbon tests that need them skip.
      - run: node skills/adapter-carbon/scripts/sources.mjs
      # Without the pinned Tailwind, TypeScript, shadcn stylesheets and preview packages, the adapter-generic tests that need them skip.
      - run: node skills/adapter-generic/scripts/sources.mjs
      # Without its packages, the to-handoff tests skip; the runtime tests, and adapter-generic's catalog
      # measurements, use the runner's Chrome.
      - run: node skills/to-handoff/scripts/deps.mjs
      # Through NODE_OPTIONS: node --test ignores a --test-shard placed after the file globs, as `npm test -- …` would put it.
      - run: npm test
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}/4

  # The one check to require: green only when every shard is.
  test:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.shard.result }}" = success
