name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Without the pinned Carbon sources and preview packages, 42 adapter-carbon tests skip.
      - run: node skills/adapter-carbon/scripts/sources.mjs
      # Without the pinned Tailwind, TypeScript and shadcn stylesheets, 21 adapter-generic tests skip.
      - run: node skills/adapter-generic/scripts/sources.mjs
      # Without parse5, the to-handoff tests skip.
      - run: node skills/to-handoff/scripts/deps.mjs
      - run: npm test
