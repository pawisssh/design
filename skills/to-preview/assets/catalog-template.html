<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Component preview</title>
<!-- library-styles -->
<style>
  /* Chrome colours are Carbon tokens (--cds-*) from the library stylesheet; the Theme toggle puts its Mode class on <body>,
     a Layer toggle on a wrapper around the grid, and a card's background is the layer's own surface, --cds-layer-background (at level one it equals --cds-background). */
  body > header,.tp-main,.tp-toolbar,.tp-cell,.tp-specimen,.tp-toolbar select,#export,.tp-toolbar button{box-sizing:border-box}
  body.tp-page{margin:0;font:14px/1.4 system-ui,sans-serif;color:var(--cds-text-primary);background:var(--cds-layer-01)}
  #export,.tp-toolbar button,.tp-toolbar select{font:inherit} #export,.tp-toolbar button{cursor:pointer;padding:8px 12px;border:1px solid var(--cds-border-strong-01);background:var(--cds-field-02);color:var(--cds-text-primary)}
  #export:disabled{cursor:default;opacity:.5}
  #export:focus-visible,.tp-toolbar button:focus-visible,.tp-toolbar select:focus-visible,.tp-card-head > input:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
  body > header{padding:20px 24px;background:var(--cds-background);border-bottom:1px solid var(--cds-border-subtle-01);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  body > header > h1{font-size:20px;margin:0} .tp-main{padding:24px;min-width:0}
  .tp-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 20px}.tp-toolbar label{display:flex;gap:5px;align-items:center}
  .tp-toolbar select{padding:7px;border:1px solid var(--cds-border-strong-01);background:var(--cds-field-02);color:var(--cds-text-primary)}
  /* Cards butt together with shared 1px borders: each card overlaps the one before it by its border.
     A catalog's cards share one size, 200×200 unless a specimen needs more; sizeCells() sets it. Each card is one
     column (minmax(0,1fr)), so its text wraps or cuts inside it and never widens it. */
  #grid{--tp-cell-width:200px;--tp-cell-height:200px;display:grid;grid-template-columns:repeat(auto-fill,var(--tp-cell-width));max-width:calc(6 * var(--tp-cell-width));box-sizing:content-box;padding:1px 0 0 1px}
  .tp-cell{width:var(--tp-cell-width);height:var(--tp-cell-height);margin:-1px 0 0 -1px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;row-gap:8px;border:1px solid var(--cds-border-subtle-01);background:var(--cds-layer-background,var(--cds-background))}
  .tp-card-head{display:flex;gap:8px;align-items:start;justify-content:space-between}.tp-card-head > input{margin:0;flex:none;accent-color:var(--cds-icon-primary)}
  .tp-card-name{font-size:12px;line-height:16px;overflow-wrap:anywhere}
  .tp-drafted{font-style:italic;text-decoration:underline dotted var(--cds-support-warning);text-underline-offset:2px}.tp-drafted::after{content:"*"}
  .tp-specimen{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
  .tp-specimen > .tp-fill{flex:1 1 auto}
  .tp-omitted .tp-specimen{opacity:.4} #grid.tp-measuring .tp-specimen{width:min-content} #grid.tp-measuring-height .tp-cell{height:auto}
  .tp-card-foot{display:flex;flex-wrap:wrap;column-gap:16px;font-size:12px;line-height:16px;color:var(--cds-text-secondary)}.tp-card-foot > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tp-cell[hidden]{display:none} #status{color:var(--cds-text-secondary);flex:1} #error{color:var(--cds-text-error);white-space:pre-wrap}
  @media(max-width:760px){.tp-main{padding:16px}}
</style>
<body class="tp-page">
<header><h1 id="title">Component preview</h1><span id="status" aria-live="polite">Loading the catalog.</span><button id="export" disabled>Export omit patch</button></header>
<main class="tp-main"><div id="filters" class="tp-toolbar"></div><div id="grid"></div><p id="error" role="alert"></p></main>
<script src="./contract.js"></script>
<script src="./selection-model.js"></script>
<script src="./catalog-card.js"></script>
<script>
(() => {
  "use strict";
  // To-preview shell over one Contract. catalog = {contract, toggles, forces, sourceLabel, specimens}; see scripts/catalog.mjs.
  // Checked = kept in the Contract; unchecked = omitted. The Base Component is locked on.
  const $ = id => document.getElementById(id);
  // toggleState[i]: toggle i's element and its current Mode {host, key, className}.
  let model, catalog, renderer, toggleState = [], filters = {}, rendered = false;
  // Node factory for the page and the cards: props are DOM properties, `dataset` and `aria-*` attributes.
  const h = (tag, props = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === "dataset") Object.assign(node.dataset, value);
      else if (key.startsWith("aria-")) node.setAttribute(key, value);
      else node[key] = value;
    }
    node.append(...children);
    return node;
  };
  function setMode(i, key) {
    const m = toggleState[i];
    if (m.className) m.host.classList.remove(m.className);
    m.key = key; m.className = catalog.toggles[i].modes.find(x => x.key === key).className;
    m.host.classList.add(m.className);
  }
  const atDefaults = () => toggleState.every((m, i) => m.key === catalog.toggles[i].modes[0].key);
  // The first toggle (Theme) goes on <body>, so the chrome follows it; each later one (Layer) on its own wrapper
  // around the grid, nested in document order, so its class sits inside the earlier ones' (a Carbon Theme class
  // resets the layer tokens to level one). Undoes any earlier wrapping first, and resets every toggle to its first Mode.
  function resetModeHosts() {
    for (const m of toggleState) if (m.className) m.host.classList.remove(m.className);
    const grid = $("grid");
    while (grid.parentElement.classList.contains("tp-mode-host")) grid.parentElement.replaceWith(grid);
    toggleState = catalog.toggles.map((_, i) => {
      if (i === 0) return { host: document.body };
      const host = h("div", { className: "tp-mode-host" });
      grid.replaceWith(host); host.append(grid);
      return { host };
    });
    catalog.toggles.forEach((t, i) => setMode(i, t.modes[0].key));
  }

  function summary() {
    const total = model.specimens.size, checked = model.selected.size;
    $("status").textContent = checked + " of " + total + " variants checked · " + (total - checked) + " omitted · the Base Component is locked on";
    $("export").disabled = !rendered;
    document.querySelectorAll(".tp-cell").forEach(cell => {
      const on = model.selected.has(cell.dataset.id); cell.classList.toggle("tp-omitted", !on); cell.querySelector("input").checked = on;
    });
  }
  function filterGrid() {
    document.querySelectorAll(".tp-cell").forEach(cell => { cell.hidden = !model.matches(model.specimen(cell.dataset.id), filters); });
  }
  function controls() {
    $("filters").replaceChildren();
    for (const axis of catalog.contract.axes) {
      const label = h("label", {}, axis.label), select = h("select");
      select.append(new Option("All", ""));
      for (const value of axis.values) select.append(new Option(value.label, value.key));
      select.onchange = () => { filters[axis.key] = select.value; filterGrid(); };
      label.append(select); $("filters").append(label);
    }
    for (const [text, value] of [["Check visible", true], ["Uncheck visible", false]]) {
      const button = h("button", {}, text); button.onclick = () => { model.selectMatching(filters, value); summary(); }; $("filters").append(button);
    }
    catalog.toggles.forEach((t, i) => {
      // Display only: swaps the Mode class, so the specimens and the card chrome follow it;
      // nothing re-renders and the selection is untouched.
      const label = h("label", {}, t.label), select = h("select");
      for (const m of t.modes) select.append(new Option(m.label, m.key));
      select.onchange = () => setMode(i, select.value);
      label.append(select); $("filters").append(label);
    });
  }

  // State forcing: copy every style rule that uses a forced pseudo-class (":hover") with the pseudo-class
  // replaced by a class (".tp-force-hover"), right after the original so the cascade order holds. Copies
  // from a hover-capability media query (@media (any-hover: hover)) go beside the query, not inside it.
  function splitSelectors(text) {
    const out = []; let depth = 0, current = "";
    for (const ch of text) {
      if (ch === "(" || ch === "[") depth++; else if (ch === ")" || ch === "]") depth--;
      if (ch === "," && !depth) { out.push(current); current = ""; } else current += ch;
    }
    return out.concat(current).map(s => s.trim());
  }
  function forceStates(pseudos) {
    const patterns = pseudos.map(p => [new RegExp(p + "(?![\\w-])", "g"), ".tp-force-" + p.slice(1)]);
    const forced = rule => {
      const selectors = splitSelectors(rule.selectorText).filter(s => patterns.some(([re]) => { re.lastIndex = 0; return re.test(s); }));
      if (!selectors.length) return null;
      return selectors.map(s => patterns.reduce((acc, [re, cls]) => acc.replace(re, cls), s)).join(", ") + "{" + rule.style.cssText + "}";
    };
    const walk = list => {
      for (let i = list.cssRules.length - 1; i >= 0; i--) {
        const rule = list.cssRules[i];
        if (rule.selectorText !== undefined) { const text = forced(rule); if (text) list.insertRule(text, i + 1); }
        else if (rule.cssRules && rule.media && /hover/.test(rule.media.mediaText))
          [...rule.cssRules].map(r => r.selectorText !== undefined ? forced(r) : null).filter(Boolean).reverse().forEach(text => list.insertRule(text, i + 1));
        else if (rule.cssRules && rule.insertRule) walk(rule);
      }
    };
    for (const sheet of document.styleSheets) { try { walk(sheet); } catch (error) { /* a cross-origin sheet cannot be read */ } }
  }

  // One card size for the catalog. The width is 200px, or wider when a specimen does not fit a 200px card's host. A
  // specimen's width is its min-content width, so one with a set width (Carbon's Toast is 18rem) counts at that width
  // and a fluid one (width:100%) counts at its narrowest, and still fills the card. The height is 200px, or the
  // tallest card's at that width: its label, specimen and footer.
  function sizeCells() {
    const grid = $("grid"), cell = grid.querySelector(".tp-cell");
    if (!cell) return;
    grid.style.removeProperty("--tp-cell-width"); grid.style.removeProperty("--tp-cell-height");
    const chrome = cell.offsetWidth - cell.querySelector(".tp-specimen").clientWidth;
    grid.classList.add("tp-measuring");
    let widest = 0;
    for (const host of grid.querySelectorAll(".tp-specimen")) if (host.firstElementChild) widest = Math.max(widest, host.firstElementChild.getBoundingClientRect().width);
    grid.classList.remove("tp-measuring");
    if (Math.ceil(widest) + chrome > 200) grid.style.setProperty("--tp-cell-width", Math.ceil(widest) + chrome + "px");
    grid.classList.add("tp-measuring-height");
    let tallest = 0;
    for (const c of grid.querySelectorAll(".tp-cell")) tallest = Math.max(tallest, c.offsetHeight);
    grid.classList.remove("tp-measuring-height");
    if (tallest > 200) grid.style.setProperty("--tp-cell-height", tallest + "px");
  }
  // A specimen whose Contract root is fill width fills its card, as it fills its parent (the shadcn Card).
  const fills = specimen => { const root = window.Contract.resolve(catalog.contract, specimen.tuple).layout[catalog.contract.anatomy.name]; return !!root && root.width === "fill"; };
  // A specimen's width can follow the viewport (Carbon's Toast is 22rem from 99rem), so a resize sizes the cards again.
  let resizing = 0;
  window.addEventListener("resize", () => { if (rendered && !resizing) resizing = requestAnimationFrame(() => { resizing = 0; sizeCells(); }); });

  async function render() {
    $("grid").replaceChildren();
    const forceFor = specimen => catalog.forces.filter(f => specimen.tuple[f.axis] === f.value).map(f => "tp-force-" + f.pseudo.slice(1));
    try {
      for (const specimen of model.specimens.values()) {
        const { card, checkbox, host } = catalogCard(specimen, { contract: catalog.contract, baseId: model.baseId, sourceLabel: catalog.sourceLabel, h });
        checkbox.onchange = () => { model.select(specimen.id, checkbox.checked); summary(); };
        $("grid").append(card);
        const inDefaults = atDefaults();
        await renderer(specimen, host);
        if (!host.firstElementChild) throw new Error("The renderer returned an empty specimen: " + specimen.name);
        if (fills(specimen)) host.firstElementChild.classList.add("tp-fill");
        // A form control styles :hover and :focus on its nested <input> or <select>, not its root (#93), so the
        // forced class goes on every element of the specimen, as a pointer over the innermost one would.
        for (const el of [host.firstElementChild, ...host.firstElementChild.querySelectorAll("*")]) el.classList.add(...forceFor(specimen));
        if (inDefaults) model.verify(specimen.id);
      }
      if (document.fonts) await document.fonts.ready;
      sizeCells();
      rendered = true;
    } catch (error) { $("error").textContent = error.message; }
    summary();
  }

  function download(name, data) {
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2) + "\n"], { type: "application/json" })), link = h("a");
    link.href = url; link.download = name; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function selection() {
    const patch = model.omitPatch();
    return { patch, checked: { family: patch.family, snapshotId: patch.snapshotId, checked: model.checkedTuples() } };
  }
  $("export").onclick = () => {
    $("error").textContent = "";
    try {
      const { patch, checked } = selection(), family = patch.family;
      download(family + ".omit-patch.json", patch);
      download(family + ".checked.json", checked);
      window.dispatchEvent(new CustomEvent("to-preview:selection", { detail: { patch, checked } }));
      $("status").textContent = "Exported " + family + ".omit-patch.json (" + patch.expectedCount + " variants, " + patch.omit.length + " omit patterns) and " + family + ".checked.json. The agent applies them to the Contract.";
    } catch (error) { $("error").textContent = error.message; }
  };

  window.Catalog = {
    configure(options) {
      if (typeof options.renderSpecimen !== "function") throw new Error("Provide the Adapter's specimen renderer");
      catalog = options.catalog; renderer = options.renderSpecimen; filters = {}; rendered = false;
      model = new CatalogSelection(catalog.contract, window.Contract);
      resetModeHosts();
      $("title").textContent = catalog.contract.family.name + " preview";
      forceStates([...new Set(catalog.forces.map(f => f.pseudo))]);
      controls(); summary(); render();
      return model;
    },
    getSelection: selection
  };
})();
</script>
<!-- catalog -->
</html>
