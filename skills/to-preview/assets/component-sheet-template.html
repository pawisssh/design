<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Component preview</title>
<!-- library-styles -->
<style>
  body > header,.cs-main,.cs-toolbar,.cs-cell,.cs-cell-title,.cs-specimen,.cs-toolbar select,#export,.cs-toolbar button{box-sizing:border-box} body{margin:0;font:14px system-ui,sans-serif;color:#18222e;background:#f5f7fa}
  #export,.cs-toolbar button,.cs-toolbar select,.cs-cell-title > input{font:inherit} #export,.cs-toolbar button{cursor:pointer;padding:8px 12px;border:1px solid #ccd4df;border-radius:7px;background:white;color:#18222e}
  #export:disabled{cursor:default;opacity:.5}
  #export:focus-visible,.cs-toolbar button:focus-visible,.cs-toolbar select:focus-visible,.cs-cell-title > input:focus-visible{outline:3px solid #91b8ff;outline-offset:2px}
  body > header{padding:20px 24px;background:white;border-bottom:1px solid #dbe1e9;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  body > header > h1{font-size:20px;margin:0} .cs-main{padding:24px;min-width:0}
  .cs-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 20px}.cs-toolbar label{display:flex;gap:5px;align-items:center}
  .cs-toolbar select{padding:7px;border:1px solid #ccd4df;border-radius:6px;background:white;color:#18222e}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;align-items:start}
  .cs-cell{background:white;border:1px solid #dbe1e9;border-radius:9px;padding:14px;min-width:0}.cs-cell.cs-omitted{border-style:dashed;background:#f0f2f5}
  .cs-cell-title{display:flex;gap:7px;align-items:start;font-size:12px;margin-bottom:12px}.cs-specimen{padding:16px;min-height:72px;overflow:visible}
  .cs-cell[hidden]{display:none} #status{color:#49566a;flex:1} #error{color:#9a2424;white-space:pre-wrap}
  @media(max-width:760px){.cs-main{padding:16px}}
</style>
<header><h1 id="title">Component preview</h1><span id="status" aria-live="polite">Loading the catalog.</span><button id="export" disabled>Export omit patch</button></header>
<main class="cs-main"><div id="filters" class="cs-toolbar"></div><div id="grid"></div><p id="error" role="alert"></p></main>
<script src="./contract.js"></script>
<script src="./selection-model.js"></script>
<script>
(() => {
  "use strict";
  // To-preview shell over one Contract. catalog = {contract, modes, forces, specimens}; see scripts/catalog.mjs.
  // Checked = kept in the Contract; unchecked = omitted. The Base Component is locked on.
  const $ = id => document.getElementById(id);
  let model, catalog, renderer, mode, filters = {}, rendered = false;
  const element = (tag, text) => { const node = document.createElement(tag); if (text !== undefined) node.textContent = text; return node; };
  const modeClass = key => (catalog.modes.find(m => m.key === key) || {}).className;
  const defaultMode = () => catalog.modes.length ? catalog.modes[0].key : undefined;

  function summary() {
    const total = model.specimens.size, checked = model.selected.size;
    $("status").textContent = checked + " of " + total + " variants checked · " + (total - checked) + " omitted · the Base Component is locked on";
    $("export").disabled = !rendered;
    document.querySelectorAll(".cs-cell").forEach(cell => {
      const on = model.selected.has(cell.dataset.id); cell.classList.toggle("cs-omitted", !on); cell.querySelector("input").checked = on;
    });
  }
  function filterGrid() {
    document.querySelectorAll(".cs-cell").forEach(cell => { cell.hidden = !model.matches(model.specimen(cell.dataset.id), filters); });
  }
  function controls() {
    $("filters").replaceChildren();
    for (const axis of catalog.contract.axes) {
      const label = element("label", axis.label), select = element("select");
      select.append(new Option("All", ""));
      for (const value of axis.values) select.append(new Option(value.label, value.key));
      select.onchange = () => { filters[axis.key] = select.value; filterGrid(); };
      label.append(select); $("filters").append(label);
    }
    for (const [text, value] of [["Check visible", true], ["Uncheck visible", false]]) {
      const button = element("button", text); button.onclick = () => { model.selectMatching(filters, value); summary(); }; $("filters").append(button);
    }
    if (catalog.modes.length > 1) {
      // Display only: swaps the theme class on every specimen; nothing re-renders and the selection is untouched.
      const label = element("label", "Theme"), select = element("select");
      for (const m of catalog.modes) select.append(new Option(m.label, m.key));
      select.onchange = () => {
        const from = modeClass(mode); mode = select.value;
        document.querySelectorAll(".cs-specimen").forEach(host => { host.classList.remove(from); host.classList.add(modeClass(mode)); });
      };
      label.append(select); $("filters").append(label);
    }
  }

  // State forcing: copy every style rule that uses a forced pseudo-class (":hover") with the pseudo-class
  // replaced by a class (".cs-force-hover"), right after the original so the cascade order holds. Copies
  // from a hover-capability media query (@media (any-hover: hover)) go beside the query, not inside it.
  function splitSelectors(text) {
    const out = []; let depth = 0, current = "";
    for (const ch of text) {
      if (ch === "(" || ch === "[") depth++; else if (ch === ")" || ch === "]") depth--;
      if (ch === "," && !depth) { out.push(current); current = ""; } else current += ch;
    }
    return out.concat(current).map(s => s.trim());
  }
  function forceStates(pseudos) {
    const patterns = pseudos.map(p => [new RegExp(p + "(?![\\w-])", "g"), ".cs-force-" + p.slice(1)]);
    const forced = rule => {
      const selectors = splitSelectors(rule.selectorText).filter(s => patterns.some(([re]) => { re.lastIndex = 0; return re.test(s); }));
      if (!selectors.length) return null;
      return selectors.map(s => patterns.reduce((acc, [re, cls]) => acc.replace(re, cls), s)).join(", ") + "{" + rule.style.cssText + "}";
    };
    const walk = list => {
      for (let i = list.cssRules.length - 1; i >= 0; i--) {
        const rule = list.cssRules[i];
        if (rule.selectorText !== undefined) { const text = forced(rule); if (text) list.insertRule(text, i + 1); }
        else if (rule.cssRules && rule.media && /hover/.test(rule.media.mediaText))
          [...rule.cssRules].map(r => r.selectorText !== undefined ? forced(r) : null).filter(Boolean).reverse().forEach(text => list.insertRule(text, i + 1));
        else if (rule.cssRules && rule.insertRule) walk(rule);
      }
    };
    for (const sheet of document.styleSheets) { try { walk(sheet); } catch (error) { /* a cross-origin sheet cannot be read */ } }
  }

  async function render() {
    $("grid").replaceChildren();
    const forceFor = specimen => catalog.forces.filter(f => specimen.tuple[f.axis] === f.value).map(f => "cs-force-" + f.pseudo.slice(1));
    try {
      for (const specimen of model.specimens.values()) {
        const cell = element("section"); cell.className = "cs-cell"; cell.dataset.id = specimen.id;
        const title = element("label"); title.className = "cs-cell-title";
        const checkbox = element("input"); checkbox.type = "checkbox";
        if (specimen.id === model.baseId) { checkbox.disabled = true; checkbox.title = "The Base Component is locked on"; }
        checkbox.onchange = () => { model.select(specimen.id, checkbox.checked); summary(); };
        title.append(checkbox, element("span", specimen.name + (specimen.id === model.baseId ? " · Base Component" : "")));
        const host = element("div"); host.className = "cs-specimen"; host.dataset.specimenId = specimen.id;
        if (modeClass(mode)) host.classList.add(modeClass(mode));
        cell.append(title, host); $("grid").append(cell);
        const renderedIn = mode;
        await renderer(specimen, host);
        if (!host.firstElementChild) throw new Error("The renderer returned an empty specimen: " + specimen.name);
        host.firstElementChild.classList.add(...forceFor(specimen));
        if (renderedIn === defaultMode()) model.verify(specimen.id);
      }
      if (document.fonts) await document.fonts.ready;
      rendered = true;
    } catch (error) { $("error").textContent = error.message; }
    summary();
  }

  function download(name, data) {
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2) + "\n"], { type: "application/json" })), link = element("a");
    link.href = url; link.download = name; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function selection() {
    const patch = model.omitPatch();
    return { patch, checked: { family: patch.family, snapshotId: patch.snapshotId, checked: model.checkedTuples() } };
  }
  $("export").onclick = () => {
    $("error").textContent = "";
    try {
      const { patch, checked } = selection(), family = patch.family;
      download(family + ".omit-patch.json", patch);
      download(family + ".checked.json", checked);
      window.dispatchEvent(new CustomEvent("component-sheet:selection", { detail: { patch, checked } }));
      $("status").textContent = "Exported " + family + ".omit-patch.json (" + patch.expectedCount + " variants, " + patch.omit.length + " omit patterns) and " + family + ".checked.json. The agent applies them to the Contract.";
    } catch (error) { $("error").textContent = error.message; }
  };

  window.ComponentSheet = {
    configure(options) {
      if (typeof options.renderSpecimen !== "function") throw new Error("Provide the Adapter's specimen renderer");
      catalog = options.catalog; renderer = options.renderSpecimen; filters = {}; rendered = false;
      model = new ComponentSheetSelection(catalog.contract, window.Contract);
      mode = defaultMode();
      $("title").textContent = catalog.contract.family.name + " preview";
      forceStates([...new Set(catalog.forces.map(f => f.pseudo))]);
      controls(); summary(); render();
      return model;
    },
    getSelection: selection
  };
})();
</script>
<!-- catalog -->
</html>
