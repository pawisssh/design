<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design System review</title>
<style>
  :root{--vr-bg:#f6f6f6;--vr-surface:#fff;--vr-text:#161616;--vr-muted:#525252;--vr-border:#e0e0e0;--vr-accent:#0f62fe;--vr-error:#da1e28;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--vr-bg:#161616;--vr-surface:#262626;--vr-text:#f4f4f4;--vr-muted:#c6c6c6;--vr-border:#393939;--vr-accent:#78a9ff;--vr-error:#ff8389;color-scheme:dark}}
  :root[data-theme="dark"]{--vr-bg:#161616;--vr-surface:#262626;--vr-text:#f4f4f4;--vr-muted:#c6c6c6;--vr-border:#393939;--vr-accent:#78a9ff;--vr-error:#ff8389;color-scheme:dark}
  *{box-sizing:border-box} body{margin:0;font:14px/1.4 system-ui,sans-serif;color:var(--vr-text);background:var(--vr-bg)}
  header{padding:16px 24px;background:var(--vr-surface);border-bottom:1px solid var(--vr-border);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  header h1{font-size:20px;margin:0} #status{color:var(--vr-muted);flex:1;min-width:200px} #error{color:var(--vr-error);white-space:pre-wrap;margin:0 24px}
  button{font:inherit;cursor:pointer;padding:8px 12px;border:1px solid var(--vr-border);background:var(--vr-surface);color:var(--vr-text)}
  button:focus-visible{outline:2px solid var(--vr-accent);outline-offset:2px} #export:disabled{opacity:.5;cursor:default}
  [role=tablist]{display:flex;gap:0;overflow-x:auto;background:var(--vr-surface);border-bottom:1px solid var(--vr-border);padding:0 24px}
  [role=tab]{border:0;border-bottom:2px solid transparent;background:none;padding:12px 16px;white-space:nowrap}
  [role=tab][aria-selected=true]{border-bottom-color:var(--vr-accent);font-weight:600}
  [role=tabpanel]{padding:24px} [role=tabpanel][hidden]{display:none}
  h2{font-size:16px;margin:0 0 12px} .vr-note{color:var(--vr-muted);margin:0 0 16px;max-width:72ch}
  table{border-collapse:collapse;background:var(--vr-surface);margin:0 0 24px;max-width:100%} th,td{border:1px solid var(--vr-border);padding:6px 10px;text-align:left;vertical-align:middle}
  th{font-weight:600} .vr-table{overflow-x:auto}
  .vr-swatch{display:inline-block;width:20px;height:20px;border:1px solid var(--vr-border);vertical-align:middle;margin-right:8px;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);background-size:8px 8px;background-position:0 0,4px 4px}
  .vr-swatch > span{display:block;width:100%;height:100%}
  code{font:12px/1.4 ui-monospace,monospace} .vr-specimen{white-space:nowrap}
  .vr-drafted{margin:0 0 16px;color:var(--vr-muted)} .vr-drafted summary{cursor:pointer} .vr-drafted table{color:var(--vr-text);margin:8px 0 0}
  .vr-family-head{margin:0 0 16px} .vr-family-head p{margin:4px 0;max-width:72ch}
  iframe{display:block;width:100%;height:calc(100vh - 140px);min-height:480px;border:1px solid var(--vr-border);background:var(--vr-surface)}
  @media(max-width:760px){header,[role=tablist]{padding-left:16px;padding-right:16px}[role=tabpanel]{padding:16px}}
</style>
<body>
<header><h1 id="title">Design System review</h1><span id="status" aria-live="polite">Loading the catalogs.</span><button id="export" disabled>Export the review</button></header>
<p id="error" role="alert"></p>
<nav role="tablist" id="tabs" aria-label="Review tabs"></nav>
<main id="panels"></main>
<!-- review -->
<script src="./review-export.js"></script>
<script src="./review-store.js"></script>
<script>
(() => {
  "use strict";
  // Vibe-to-Figma's review shell (#177, #178). review = {model, tabs, catalogs}: model is reviewModel() (scripts/review.mjs),
  // catalogs maps a family to To-preview's own catalog page, run unchanged in an iframe. Export collects each catalog's
  // Catalog.getSelection() into one file; as an Artifact, the db keeps them instead. Drafted values are read-only here:
  // the owner changes them in chat.
  const review = JSON.parse(document.getElementById("review").textContent);
  const { model } = review;
  const $ = id => document.getElementById(id);
  const h = (tag, props = {}, ...children) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) { if (k.startsWith("aria-") || k === "role") node.setAttribute(k, v); else node[k] = v; }
    node.append(...children);
    return node;
  };
  const text = v => (typeof v === "string" ? v : JSON.stringify(v));
  const table = (head, rows) => h("div", { className: "vr-table" }, h("table", {}, h("thead", {}, h("tr", {}, ...head.map(x => h("th", {}, x)))), h("tbody", {}, ...rows.map(r => h("tr", {}, ...r.map(c => h("td", {}, c)))))));
  const swatch = color => h("span", { className: "vr-swatch" }, Object.assign(h("span"), { style: "background:" + color }));

  $("title").textContent = model.designSystem + " review";
  document.title = model.designSystem + " review";

  function foundationsPanel() {
    const f = model.foundations, { modes } = f.colors;
    return [
      ...(model.kept.length ? [h("p", { className: "vr-note" }, "Kept approved, their code unchanged, so not reviewed again: " + model.kept.join(", ") + ".")] : []),
      ...(f.approved ? [] : [h("p", { className: "vr-note" }, "This Foundations document is not the one the last approve covered. Nothing goes to Figma until the owner approves it" + (model.families.length ? " with the Contracts." : ": say \"approve\" in chat."))]),
      h("h2", {}, "Colors"),
      h("p", { className: "vr-note" }, f.colors.variables.length + " color variables, read from the project's CSS. Foundations change only with the code."),
      table(["Variable", ...modes.map(m => m.label)], f.colors.variables.map(v => [h("code", {}, v.name), ...modes.map(m => h("span", {}, swatch(v.values[m.key]), h("code", {}, v.values[m.key])))])),
      h("h2", {}, "Text Styles"),
      h("p", { className: "vr-note" }, f.textStyles.length + " Text Styles."),
      table(["Style", "Specimen", "Font", "Size / line", "Weight"], f.textStyles.map(s => [
        h("code", {}, s.name),
        h("span", { className: "vr-specimen", style: "font-family:'" + s.fontFamily + "',system-ui;font-size:" + s.fontSize + "px;line-height:" + s.lineHeight + ";font-weight:" + s.fontWeight }, "Aa Request access"),
        s.fontFamily + " " + s.fontStyle, s.fontSize + " / " + s.lineHeight, String(s.fontWeight)])),
    ];
  }
  // The Families tab (#262), only for an Extracted Library: what the script found in the Prototype, before anything reaches
  // Figma. Read-only; the owner corrects the grouping in chat and the page is published again.
  const site = s => s.file + ":" + s.line;
  const snippet = s => h("code", {}, s.snippet);
  function familiesPanel() {
    const { families, unmatched, skipped } = model.extracted;
    const byFamily = families.map(f => {
      return [
        h("h2", {}, f.family + " · " + f.sites.length + " site" + (f.sites.length === 1 ? "" : "s")),
        h("p", { className: "vr-note" }, f.description + " · <" + f.tag + "> · " + (f.by === "owner" ? "set by the owner: " + f.evidence.join("; ") : "grouped by the agent: " + f.evidence.join("; "))),
        table(["Site", "Source"], f.sites.map(s => [h("code", {}, site(s)), snippet(s)])),
        ...(f.axes.length ? [table(["Axis", "Value", "Classes", "Given by"], f.axes.flatMap(a => a.values.map(v => [
          h("span", {}, a.label + " (", h("code", {}, a.key), ")"), h("span", {}, v.label + " (", h("code", {}, v.key), ")" + (a.default === v.key ? " · default" : "")),
          h("code", {}, v.classes.join(" ") || "none"), h("code", {}, v.sites.join(", "))])))]
          : [h("p", { className: "vr-note" }, "No axis: every site renders the same.")]),
      ];
    });
    return [
      h("p", { className: "vr-note" }, families.length + " Component Families found in the Prototype, built into the Extracted Library the other tabs render. Nothing reaches Figma before you approve. To correct a grouping, say so in chat: merge X into Y, split Z, drop W, rename Y. The page is published again to the same link, and your ticks stay."),
      ...byFamily.flat(),
      h("h2", {}, "Elements no family took (" + unmatched.length + ")"),
      ...(unmatched.length ? [table(["Site", "Source", "Why"], unmatched.map(u => [h("code", {}, site(u)), snippet(u), u.reason]))] : [h("p", { className: "vr-note" }, "None.")]),
      h("h2", {}, "Skipped sites (" + skipped.length + ")"),
      ...(skipped.length ? [table(["Site", "Source", "Reason"], skipped.map(u => [h("code", {}, u.site), h("code", {}, u.snippet || ""), u.reason]))] : [h("p", { className: "vr-note" }, "None.")]),
    ];
  }
  function familyPanel(f) {
    const head = h("div", { className: "vr-family-head" },
      h("h2", {}, f.name),
      h("p", {}, f.description),
      h("p", { className: "vr-note" }, f.variants + " variants checked in the Contract · status " + f.status + ". Untick what to leave out, then export."));
    const parts = [head];
    if (f.drafted.length) parts.push(h("details", { className: "vr-drafted" },
      h("summary", {}, f.drafted.length + " Drafted values (read-only; ask in chat to change one)"),
      table(["Key", "Value", "By"], f.drafted.map(d => [h("code", {}, d.key), text(d.value), d.by]))));
    const frame = h("iframe", { title: f.name + " catalog" });
    frame.dataset.family = f.family;
    frame.srcdoc = review.catalogs[f.family];
    parts.push(frame);
    return parts;
  }

  const frames = [];
  const tabs = review.tabs.map((key, i) => {
    const f = model.families.find(x => x.family === key);
    const extracted = !f && key === "families" && model.extracted;
    const tab = h("button", { role: "tab", id: "tab-" + key, "aria-controls": "panel-" + key, "aria-selected": String(i === 0) }, f ? f.name : extracted ? "Families" : "Foundations");
    const panel = h("section", { role: "tabpanel", id: "panel-" + key, "aria-labelledby": "tab-" + key, hidden: i !== 0 }, ...(f ? familyPanel(f) : extracted ? familiesPanel() : foundationsPanel()));
    const frame = panel.querySelector("iframe");
    if (frame) frames.push(frame);
    tab.onclick = () => {
      document.querySelectorAll("[role=tab]").forEach(t => t.setAttribute("aria-selected", String(t === tab)));
      document.querySelectorAll("[role=tabpanel]").forEach(p => { p.hidden = p !== panel; });
      // A hidden catalog measured its cards at zero width: a resize sizes them again.
      if (frame && frame.contentWindow) frame.contentWindow.dispatchEvent(new Event("resize"));
    };
    $("tabs").append(tab); $("panels").append(panel);
    return tab;
  });

  // Each catalog keeps its own page; only its per-family export button goes, since this page exports them all.
  const loaded = Promise.all(frames.map(frame => new Promise(resolve => frame.addEventListener("load", () => {
    const own = frame.contentDocument && frame.contentDocument.getElementById("export");
    if (own) own.hidden = true;
    resolve();
  }, { once: true }))));

  function selections() {
    return Object.fromEntries(frames.map(frame => [frame.dataset.family, frame.contentWindow.Catalog.getSelection()]));
  }

  // Published as an Artifact (#178), the ticks persist in its db (ReviewStore.DOC) and come back on a reload; approve
  // reads them from there. Only the owner's ticks are saved. A local page has no db: it keeps the export below.
  const store = (async () => {
    if (!window.claude || typeof window.claude.use !== "function") return null;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    return db ? { doc: db.doc(window.ReviewStore.DOC), owner: user ? await user.isOwner() : false } : null;
  })().catch(() => null);
  // A catalog has rendered every specimen once its own (hidden) export button is enabled.
  const rendered = frame => new Promise(resolve => {
    const own = frame.contentDocument.getElementById("export");
    if (!own.disabled) return resolve();
    new MutationObserver((_, observer) => { if (!own.disabled) { observer.disconnect(); resolve(); } }).observe(own, { attributes: true, attributeFilter: ["disabled"] });
  });
  const reason = error => (error && error.message) || String(error);
  // `last` is the document as the db holds it, `sent` the last one written to it (both ReviewStore.canonical).
  const saving = { last: null, sent: null, queue: Promise.resolve(), timer: 0 };
  const SAVING = "Saving the ticks.";
  function save(s) {
    let next;
    try { next = window.ReviewStore.storedTicks(window.ReviewExport.reviewExport(model, selections())); }
    catch (error) { $("error").textContent = error.message; return; }
    const text = window.ReviewStore.canonical(next);
    if (text !== saving.sent) {
      saving.sent = text;
      // One write at a time; each saves the page's whole state as it is then. The patches are objects of the catalogs'
      // own windows, which the db refuses as not plain JSON, so it gets a copy made in this window.
      saving.queue = saving.queue.then(() => s.doc.set(JSON.parse(text))).then(() => {
        saving.last = text; $("error").textContent = "";
      }, error => {
        saving.sent = saving.last;
        $("status").textContent = "The ticks are not saved.";
        $("error").textContent = "The ticks were not saved: " + reason(error) + ". Tick again to retry.";
      });
    }
    // Saved says so only once no tick waits and the db holds what the page shows.
    saving.queue.then(() => {
      if (!saving.timer && saving.last === saving.sent && $("status").textContent === SAVING)
        $("status").textContent = "Ticks saved. Say \"approve\" in chat, or \"approve except <family>\".";
    });
  }

  Promise.all([loaded, store]).then(async ([, s]) => {
    if (!s) { $("export").disabled = false; $("status").textContent = frames.length ? frames.length + " catalogs loaded. Export when every tab is ticked." : "Foundations only. Export, then say \"approve\" in chat."; return; }
    // An Artifact cannot download a file, so the export goes; its db holds the ticks instead.
    $("export").hidden = true;
    $("status").textContent = "Loading the saved ticks.";
    await Promise.all(frames.map(rendered));
    let saved;
    try { const snap = await s.doc.get(); saved = snap.exists ? snap.data() : null; }
    catch (error) { $("error").textContent = "The saved ticks could not be read: " + reason(error) + ". Reload the page; nothing is saved until they are."; return; }
    const { patches, stale } = window.ReviewStore.restorable(model, saved);
    for (const frame of frames) if (patches[frame.dataset.family]) frame.contentWindow.Catalog.setSelection(patches[frame.dataset.family]);
    const restored = Object.keys(patches).length;
    $("status").textContent = !frames.length ? (s.owner ? "Foundations only. Say \"approve\" in chat." : "Foundations only. Only the owner approves.")
      : (restored ? "Restored the saved ticks of " + restored + " of " + frames.length + " families. " : "") + (stale.length ? stale.join("; ") + ", so those show as their Contracts have them. " : "")
      + (s.owner ? "Ticks save as you go. Say \"approve\" in chat." : "Your ticks are not saved: only the owner's are.");
    if (!s.owner) return;
    saving.last = saving.sent = saved && !stale.length && saved.documentHash === model.foundations.documentHash ? window.ReviewStore.canonical(saved) : null;
    // A page whose state is not saved yet (first open, or a new version) saves it once, so approve reads what it shows.
    save(s);
    // A tick saves 400 ms after the last one, or at once when the owner leaves the page for the chat, so approve does
    // not read the ticks from before it.
    const now = () => { clearTimeout(saving.timer); saving.timer = 0; save(s); };
    const later = () => {
      clearTimeout(saving.timer); saving.timer = setTimeout(now, 400);
      $("status").textContent = SAVING;
    };
    document.addEventListener("visibilitychange", () => { if (document.hidden && saving.timer) now(); });
    for (const frame of frames) {
      frame.contentDocument.addEventListener("change", later);
      frame.contentDocument.addEventListener("click", event => { if (event.target.closest("button")) later(); });
    }
  });
  $("export").onclick = () => {
    $("error").textContent = "";
    try {
      const data = window.ReviewExport.reviewExport(model, selections());
      const name = model.designSystem + ".review.json";
      const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2) + "\n"], { type: "application/json" })), link = h("a");
      link.href = url; link.download = name; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      window.dispatchEvent(new CustomEvent("vibe-to-figma:review", { detail: data }));
      $("status").textContent = "Exported " + name + ": " + Object.entries(data.families).map(([k, s]) => k + " " + s.patch.expectedCount).join(", ") + ". Say \"approve\" in chat.";
    } catch (error) { $("error").textContent = error.message; }
  };
})();
</script>
</html>
